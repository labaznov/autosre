[package]
name = "autosre-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "autosre_app"
path = "src/lib.rs"

[[bin]]
name = "autosre"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
askama = "0.14"
async-trait = "0.1"
base64 = "0.22"
hmac = "0.12"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "query", "tokio"] }
# TLS без aws-lc: провайдер ring уже в дереве через reqwest, а aws-lc тянет
# cmake и не собирается статически под musl без плясок.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
humantime = "2"
humantime-serde = "1"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
autosre-domain = { path = "../domain" }
autosre-knowledge = { path = "../knowledge" }
autosre-logs = { path = "../logs" }
autosre-metrics = { path = "../metrics" }
autosre-model = { path = "../model" }
autosre-skills = { path = "../skills" }
autosre-source = { path = "../source" }
autosre-store = { path = "../store" }
thiserror.workspace = true
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
url = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }

[dev-dependencies]
autosre-knowledge = { path = "../knowledge" }
async-trait = "0.1"
chrono.workspace = true
autosre-model = { path = "../model" }
autosre-skills = { path = "../skills" }
autosre-source = { path = "../source" }
autosre-store = { path = "../store" }
argon2 = { version = "0.5", features = ["std"] }
autosre-domain = { path = "../domain" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
