# Настройки агента для лаборатории.
#
# Отличия от боевых: адреса внутри сети compose, база в томе контейнера,
# пороги ниже — в лаборатории объёмы маленькие, и с боевыми порогами не
# сработает ничего.

bind = "0.0.0.0:8096"
database = "/opt/data/sreagent/sre.db"

[logs]
url = "http://victorialogs:9428"
timeout = "30s"
error_pattern = "i(error*) OR i(exception*) OR i(panic*) OR i(fatal*) OR i(traceback*)"
# Агент пишет в те же логи, что читает. В лаборатории он в них не пишет, но
# пусть исключение стоит с самого начала: забыть его дороже, чем не заметить.
self_streams = ['{service="sreagent"}']

[metrics]
url = "http://victoriametrics:8428"
timeout = "30s"
select = [
    "process_resident_memory_bytes",
    "node_filesystem_avail_bytes",
    "http_requests_total",
]

[model]
url = "http://litellm:4000"
name = "gemma-4-12B-it-qat-q4_0-gguf"
timeout = "180s"
max_tokens = 900
temperature = 0.2

[[horizon]]
name = "15m"
width = "15m"
period = "1m"
minimum = 10
score = 3.5
ratio = 2.0

[[horizon]]
name = "1h"
width = "1h"
period = "5m"
minimum = 20
score = 3.5
ratio = 1.5

[[horizon]]
name = "24h"
width = "24h"
period = "1h"
minimum = 100
score = 3.0
ratio = 1.5

[[account]]
login = "duty"
# Хеш пароля `sreagent-lab`. Пароль лаборатории намеренно записан в README:
# прятать его тут не от кого, а войти нужно каждому, кто поднял стенд.
# Получить свой: sreagent hash <пароль>
password = "$argon2id$v=19$m=19456,t=2,p=1$N37Zjt7tGuTCu2B+BSpYRg$XeW5g91ZGp+auvy/iHsxYZVjWU4AtGqpmMudBuLJNHM"

[incidents]
# Из каких меток селектора берётся имя сервиса, в порядке предпочтения.
service_labels = ["service", "container", "job", "app", "__series__"]
silence = "30m"
link = "5m"

[collector]
# Насколько глубоко закрывать дыры в ряду при старте и сколько минут просить
# у источника за один запрос. Меньше, чем нужно самому короткому горизонту на
# базовую линию, агент не возьмёт: иначе после чистого старта он слеп часами.
backfill = "2h"
chunk = "1h"

[digging]
# Каталог скиллов в рабочей копии репозитория знаний.
skills = "/knowledge/skills"
parallel = 2
# Сколько раз модель может попросить добрать данные.
steps = 3
wider = "1h"
# Сколько инцидент ждёт разбора, прежде чем дойти до дежурного без вывода.
patience = "15m"
# Как часто очередь оглядывается и сколько заявка ждёт ответа человека.
tick = "1m"
answer = "1d"

[knowledge]
# Рабочая копия репозитория знаний: заметки правят люди, агент только читает.
notes = "/knowledge/notes"
# Куда агент пишет черновики заметок и с какой уверенности берётся за них.
drafts = "/knowledge/drafts"
# Куда ложатся отчёты: их пишет агент, люди только читают.
reports = "/knowledge/reports"
worth = 0.5
refresh = "1m"
recall = 3

[corpus]
# Сбор живых данных: по записи на каждый заход в модель, для подбора порогов и
# дообучения ([ADR-0027](../../docs/adr/0027-live-corpus.md)). Выгрузка —
# `GET /api/corpus`, построчным JSON, за входом.
collect = true
# Отдавать ли сырые строки. По умолчанию адреса, идентификаторы и числа
# маскируются: корпус уезжает из контура.
raw = false

[queue]
parallel = 2
patience = "15m"

[retention]
minute_buckets = "7d"
hour_buckets = "30d"
investigations = "7d"
incidents = "30d"
