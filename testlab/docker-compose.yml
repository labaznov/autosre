name: autosre-lab

services:
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    command:
      - "-storageDataPath=/data"
      - "-retentionPeriod=7d"
      - "-httpListenAddr=:9428"
    ports:
      - "9428:9428"
    volumes:
      - logs:/data

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    command:
      - "-storageDataPath=/data"
      - "-retentionPeriod=1"
      - "-httpListenAddr=:8428"
    ports:
      - "8428:8428"
    volumes:
      - metrics:/data

  # Поток, похожий на прод: ровный фон и сценарии по расписанию.
  generator:
    build: ./generator
    environment:
      LOGS_URL: http://victorialogs:9428
      METRICS_URL: http://victoriametrics:8428
      # Сколько часов истории засеять при старте. Без базовой линии детектору
      # не с чем сравнивать, а ждать шесть часов на каждом запуске незачем.
      SEED_HOURS: "6"
      RANDOM_SEED: "20260817"
    # Готовности источников генератор дожидается сам: в образах Victoria нет
    # ни wget, ни curl, и проверка здоровья средствами compose там невозможна.
    depends_on:
      - victorialogs
      - victoriametrics

  # Поддельная модель: живого инференса в лаборатории нет и не нужно.
  # Проверяется конвейер, а не качество разбора, поэтому ответы предсказуемы.
  model:
    build: ./model
    # Имя `litellm` — то же, что на проде: настройки лаборатории и стенда
    # различаются только адресами, а не устройством.
    networks:
      default:
        aliases: ["litellm"]
    ports:
      - "4000:4000"

  # Агент. Поднимается отдельно: `docker compose --profile agent up -d`,
  # чтобы лабораторию можно было держать и без него.
  agent:
    profiles: ["agent"]
    build:
      context: ..
      dockerfile: testlab/agent/Dockerfile
    command: ["/etc/autosre/autosre.toml"]
    environment:
      AUTOSRE_MODEL_KEY: sk-lab
      AUTOSRE_SESSION_KEY: lab-session-key
      AUTOSRE_LOG: info
    ports:
      - "8096:8096"
    volumes:
      - ./autosre.toml:/etc/autosre/autosre.toml:ro
      - ./knowledge:/knowledge
      - agent:/opt/data/autosre
    depends_on:
      - victorialogs
      - model

volumes:
  logs:
  metrics:
  agent:
