name: sreagent-lab

services:
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    command:
      - "-storageDataPath=/data"
      - "-retentionPeriod=7d"
      - "-httpListenAddr=:9428"
    ports:
      - "9428:9428"
    volumes:
      - logs:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9428/health"]
      interval: 5s
      retries: 10

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    command:
      - "-storageDataPath=/data"
      - "-retentionPeriod=1"
      - "-httpListenAddr=:8428"
    ports:
      - "8428:8428"
    volumes:
      - metrics:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 5s
      retries: 10

  # Поток, похожий на прод: ровный фон и сценарии по расписанию.
  generator:
    build: ./generator
    environment:
      LOGS_URL: http://victorialogs:9428
      METRICS_URL: http://victoriametrics:8428
      # Сколько часов истории засеять при старте. Без базовой линии детектору
      # не с чем сравнивать, а ждать шесть часов на каждом запуске незачем.
      SEED_HOURS: "6"
      RANDOM_SEED: "20260817"
    depends_on:
      victorialogs:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy

  # Агент. Поднимается отдельно: `docker compose --profile agent up -d`,
  # чтобы лабораторию можно было держать и без него.
  agent:
    profiles: ["agent"]
    build:
      context: ..
      dockerfile: testlab/agent/Dockerfile
    command: ["/etc/sreagent/sreagent.toml"]
    environment:
      SREAGENT_MODEL_KEY: sk-lab
      SREAGENT_SESSION_KEY: lab-session-key
      SREAGENT_LOG: info
    ports:
      - "8096:8096"
    volumes:
      - ./sreagent.toml:/etc/sreagent/sreagent.toml:ro
      - agent:/opt/data/sreagent
    depends_on:
      victorialogs:
        condition: service_healthy

volumes:
  logs:
  metrics:
  agent:
