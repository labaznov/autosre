# Настройки агента диагностики.
#
# Здесь всё, что описывает поведение. Ключи доступа сюда не попадают никогда —
# они приходят из окружения (ADR-0025):
#
#   AUTOSRE_MODEL_KEY       ключ LiteLLM
#   AUTOSRE_SESSION_KEY     ключ подписи сессий веб-морды
#   AUTOSRE_LOGS_PASSWORD   пароль VictoriaLogs, если он нужен

bind = "0.0.0.0:8096"
database = "/opt/data/autosre/autosre.db"

# Встроенный HTTPS веб-морды. Включён по умолчанию: пароль дежурного по голому
# HTTP виден в сети целиком. По этим путям агент ждёт свой сертификат и ключ
# в PEM; если там пусто, делает самоподписанный на первом старте — браузер
# предупредит, но соединение зашифровано. Подложите сертификат от своего
# удостоверяющего центра по тем же путям, и предупреждение уйдёт.
# Выключать только за реверс-прокси, который сам делает HTTPS.
[tls]
enabled = true
cert = "/opt/data/autosre/tls/cert.pem"
key = "/opt/data/autosre/tls/key.pem"

[logs]
url = "http://192.0.2.12:9428"
username = "admin"
timeout = "60s"
error_pattern = "i(error*) OR i(exception*) OR i(panic*) OR i(fatal*) OR i(traceback*)"
# Собственные потоки агента. Без них он находит сам себя и разбирает сам себя.
self_streams = ['{container="autosre"}']

[metrics]
url = "http://192.0.2.11:8428"
timeout = "30s"
# Правила отбора наблюдаемых серий: универсальный набор признаков здоровья.
select = [
    "process_resident_memory_bytes",
    "node_filesystem_avail_bytes",
    "go_goroutines",
    "process_start_time_seconds",
    "http_request_duration_seconds_count",
    "go_goroutines",
]

# Модель. Здесь только адрес и повадки; ключ доступа приходит из окружения
# переменной AUTOSRE_MODEL_KEY и в файле не появляется никогда (ADR-0025).
[model]
# Корень OpenAI-совместимого API. Агент сам допишет `v1/chat/completions`.
#
# ОСТОРОЖНО С ПОДПУТЁМ: адрес дописывается по правилам разрешения ссылок, и
# путь без завершающей косой черты теряет последний сегмент.
#   http://litellm:4000        -> http://litellm:4000/v1/chat/completions
#   http://proxy/openai        -> http://proxy/v1/chat/completions        (не то!)
#   http://proxy/openai/       -> http://proxy/openai/v1/chat/completions
url = "http://192.0.2.10:4000"
# Имя модели так, как его понимает сервер: оно уходит в поле `model` запроса.
name = "gemma-4-12B-it-qat-q4_0-gguf"
# Своя модель на своём железе думает долго, и это нормально: разбор идёт в
# фоне. Меньше минуты ставить не стоит — оборванный запрос стоит целого разбора.
timeout = "180s"
max_tokens = 900
# Ниже — стабильнее и скучнее. Разбор аварии не то место, где нужна выдумка.
temperature = 0.2

# Горизонты. Ширина окна и период оценки — разные вещи: задержку обнаружения
# задаёт период, а ширина отвечает за чувствительность (ADR-0014).

# Горизонт: ширина окна, как часто судить, пороги. Базовая линия — `history`
# прошлых окон, по умолчанию 24, отсюда же срок до первого суждения: пока
# столько окон не накопится, горизонт молчит.
#
#   minimum — сколько событий за окно, чтобы вообще смотреть на него;
#   score   — во сколько робастных сигм отклоняться, чтобы считаться отклонением;
#   ratio   — во сколько раз превысить обычное значение;
#   drift   — на какую долю должен сдвинуться уровень метрики (правило уровней,
#             по умолчанию 0.15; для счётчиков не применяется).
[[horizon]]
name = "15m"
width = "15m"
period = "1m"
history = 24
minimum = 20
score = 3.5
ratio = 2.0
drift = 0.15

[[horizon]]
name = "1h"
width = "1h"
period = "5m"
minimum = 40
score = 3.5
ratio = 1.5

[[horizon]]
name = "24h"
width = "24h"
period = "1h"
minimum = 200
score = 3.0
ratio = 1.5

# Пятиминутный горизонт нужен там, где важны короткие всплески и хватает
# объёма для устойчивой статистики. На малых объёмах он шумит.
[[horizon]]
name = "5m"
width = "5m"
period = "1m"
enabled = false
minimum = 15
score = 4.0
ratio = 3.0

[[account]]
login = "duty"
# Хеш пароля. Получить: autosre hash <пароль>. Здесь лежит хеш от `autosre-lab`
# — пароля лаборатории, записанного открыто. На стенде подставьте свой.
password = "$argon2id$v=19$m=19456,t=2,p=1$O9GHrJc2UKEgDwzhQzmqiQ$aFf+x9lWyTDqf3FG9HSSPvbmYJVtpkDq4ANhjyMYx/c"

[incidents]
# Из каких меток селектора берётся имя сервиса, в порядке предпочтения.
service_labels = ["service", "container", "job", "app", "__series__"]
# Через сколько тишины инцидент закрывается сам.
silence = "30m"
# Насколько близко во времени инциденты считаются связанными.
link = "5m"
# Сколько отклонений разбирать за проход и сколько строк тянуть на сигнатуру.
batch = 50
samples = 200
# Сколько групп сигнатур показывать модели: больше — дороже промпт.
groups = 7
# За какое окно брать образцы строк.
sample_window = "15m"

[collector]
# Насколько глубоко закрывать дыры в ряду при старте и сколько минут просить
# у источника за один запрос. Меньше, чем нужно самому короткому горизонту на
# базовую линию, агент не возьмёт: иначе после чистого старта он слеп часами.
backfill = "2h"
chunk = "1h"

[digging]
# Каталог скиллов в рабочей копии репозитория знаний.
skills = "/opt/data/autosre/knowledge/skills"
parallel = 4
# Сколько раз модель может попросить добрать данные.
steps = 3
wider = "1h"
# Сколько инцидент ждёт разбора, прежде чем дойти до дежурного без вывода.
patience = "15m"
# Как часто очередь оглядывается: берёт новые инциденты и гасит заявки.
tick = "1m"
# Сколько заявка ждёт ответа дежурного, прежде чем погаснуть.
answer = "1d"

[knowledge]
# Рабочая копия репозитория знаний. Заметки правит человек, агент только
# читает; черновики и отчёты пишет агент, а принимает их человек.
notes = "/opt/data/autosre/knowledge/notes"
drafts = "/opt/data/autosre/knowledge/drafts"
reports = "/opt/data/autosre/knowledge/reports"
# Как часто перечитывать каталог: правку заметки агент обязан заметить без
# перезапуска.
refresh = "5m"
# Сколько заметок уходит в досье расследования.
recall = 3
# С какой уверенности вывод годится в черновик заметки. Ниже — вывод остаётся
# на карточке, но в базу знаний не просится.
worth = 0.5

[corpus]
# Сбор живых данных: по записи на каждый заход в модель, для подбора порогов и
# дообучения. Выключен по умолчанию — это прод-логи, сложенные в отдельное
# место. Выгрузка: GET /api/corpus, построчным JSON, за входом.
collect = false
# Отдавать ли сырые строки. По умолчанию адреса и идентификаторы маскируются,
# числа и пути остаются: на числах отсев и учится.
raw = false


[retention]
# Минутные бакеты живут неделю, потом сворачиваются в часовые. Часовые кормят
# суточный горизонт и динамику отчётов, поэтому живут год с запасом.
minute_buckets = "7d"
hour_buckets = "395d"
# Расследования с досье, заявками и уроками корпуса, а также отклонения, не
# ставшие инцидентами. Тексты тяжёлые; трёх месяцев хватает и на разбор
# полётов, и на подгонку промптов.
investigations = "90d"
# Закрытые инциденты со всем, что к ним прилипло. Открытый не удаляется
# никогда. Год — чтобы метрики приёмки и повторяемость тем были видны.
incidents = "365d"
# Приглушения живут срок действия плюс 90 дней, это не настраивается.
