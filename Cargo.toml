[workspace]
members = [
    "crates/app",
    "crates/domain",
    "crates/knowledge",
    "crates/logs",
    "crates/metrics",
    "crates/model",
    "crates/skills",
    "crates/source",
    "crates/store",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Сборка для бандла ([ADR-0028](docs/adr/0028-bundle-and-systemd.md)): один
# статический файл, поменьше и побыстрее. `panic = "abort"` — осознанно:
# паника любого фонового цикла роняет процесс, а systemd его поднимает; тихая
# смерть цикла при живом процессе хуже перезапуска.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
