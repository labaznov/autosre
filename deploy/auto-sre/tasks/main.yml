---
# Переменные роли и их значения по умолчанию — в defaults/main.yml.
#
# Числа `10001` в этом файле — не произвол: под этим uid работает процесс в
# образе (см. Dockerfile, `adduser -u 10001`). Совпадение обязательно, иначе
# агент не запишет ни базу, ни черновики в репозиторий знаний, и падать будет
# на первой же записи, а не при старте.

- name: Проверить, что ключи заданы
  ansible.builtin.assert:
    that:
      - sreagent_model_key | length > 0
      - sreagent_session_key | length > 0
      - sreagent_accounts | length > 0
    fail_msg: >-
      Нужны sreagent_model_key, sreagent_session_key и хотя бы одна учётная
      запись. Значений по умолчанию у ключей нет: без них агент не стартует.
      Хеш пароля считается командой `sreagent hash <пароль>`.

# Права 0750: в /opt/docker/sreagent лежат настройки и .env с ключами, а в
# /opt/data — база с содержимым прод-логов. Читать это посторонним на хосте
# незачем.
- name: Создать каталоги
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "10001"
    mode: "0750"
  loop:
    - /opt/docker/sreagent
    - /opt/docker/sreagent/src
    - /opt/data/sreagent
    - /opt/data/sreagent/knowledge

# От имени того же uid: агент коммитит в эту копию приёмку черновиков, и
# каталог, созданный root, сделал бы это невозможным.
- name: Забрать рабочую копию репозитория знаний
  ansible.builtin.git:
    repo: "{{ sreagent_knowledge_repo }}"
    dest: /opt/data/sreagent/knowledge
    version: "{{ sreagent_knowledge_branch }}"
  become_user: "#10001"
  when: sreagent_knowledge_repo | length > 0

# Исходники копируются на хост и собираются там же: своего registry нет, а
# тащить образ ниоткуда неоткуда (ADR-0023). Сборка требует сети до crates.io.
- name: Скопировать исходники агента
  ansible.posix.synchronize:
    src: "{{ sreagent_source }}/"
    dest: /opt/docker/sreagent/src/
    delete: true
    rsync_opts:
      - "--exclude=target"
      - "--exclude=.git"
  notify: Пересобрать агента

- name: Отрендерить настройки
  ansible.builtin.template:
    src: sreagent.toml.j2
    dest: /opt/docker/sreagent/sreagent.toml
    mode: "0640"
  notify: Пересобрать агента

- name: Отрендерить секреты
  ansible.builtin.template:
    src: env.j2
    dest: /opt/docker/sreagent/.env
    mode: "0600"
  notify: Пересобрать агента

- name: Отрендерить compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/docker/sreagent/docker-compose.yml
    mode: "0640"
  notify: Пересобрать агента

- name: Поднять агента
  community.docker.docker_compose_v2:
    project_src: /opt/docker/sreagent
    build: policy
    state: present
