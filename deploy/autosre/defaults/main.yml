---
# Переменные роли и их значения по умолчанию.
#
# Здесь только то, что можно показать. Ключи доступа значений по умолчанию не
# имеют и задаются снаружи: без них агент останавливается на старте
# ([ADR-0025](../../../docs/adr/0025-config-file-and-secrets.md)).
#
# Обязательны и объявлены пустыми намеренно, чтобы проверка в `tasks/main.yml`
# сказала о нехватке внятно, а не свалилась на неопределённой переменной:
#
#   autosre_model_key    — ключ к OpenAI-совместимому API модели
#   autosre_session_key  — ключ подписи сессий веб-морды
#   autosre_accounts     — список {login, password}, пароль хешем от `autosre hash`

autosre_model_key: ""
autosre_session_key: ""
autosre_accounts: []

# Куда агент ходит за данными. Порты — родные для VictoriaLogs и VictoriaMetrics.
#
# Если в инвентаре уже есть общие `victorialogs_url` и `victoriametrics_url`,
# роль берёт их: держать один адрес в двух местах — верный способ развести их.
autosre_logs_url: "{{ victorialogs_url | default('http://192.0.2.12:9428') }}"
autosre_logs_username: "admin"
autosre_logs_password: ""
autosre_metrics_url: "{{ victoriametrics_url | default('http://192.0.2.11:8428') }}"

# Модель. Адрес — корень API: `v1/chat/completions` агент допишет сам, и
# завершающая косая черта в подпути значима (docs/OPERATIONS.md §5).
autosre_model_url: "http://192.0.2.10:4000"
autosre_model_name: "gemma-4-12B-it-qat-q4_0-gguf"

# Репозиторий знаний: скиллы, заметки, черновики, отчёты. Пустой адрес означает
# «не забирать»: агент поднимется, но разбирать инциденты ему будет нечем.
autosre_knowledge_repo: ""
autosre_knowledge_branch: "main"

# Собственные потоки агента исключаются из наблюдения в самом запросе — иначе
# он найдёт сам себя и заведёт инцидент о собственных жалобах.
autosre_self_streams: '{container="autosre"}'

# Сбор живых данных для подбора порогов и дообучения. Выгрузка — GET /api/corpus
# ([ADR-0027](../../../docs/adr/0027-live-corpus.md)). `raw` отключает
# маскирование адресов и идентификаторов: включать осознанно.
autosre_corpus: true
autosre_corpus_raw: false

# Сколько заявка ждёт ответа дежурного, прежде чем погаснуть.
autosre_answer: "1d"

# Образ и порт. Версия — тег образа, собираемого на самом хосте.
autosre_version: "latest"
autosre_port: 8096
autosre_log_level: "info"

# Откуда брать исходники для сборки. По умолчанию — соседний каталог рядом с
# playbook: своего registry нет, образ собирается на хосте
# ([ADR-0023](../../../docs/adr/0023-deploy-with-downtime.md)).
autosre_source: "{{ playbook_dir }}/../autosre"
